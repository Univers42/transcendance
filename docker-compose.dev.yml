# ============================================
# docker-compose.dev.yml — Fast local dev stack
# ============================================
# Usage:  docker compose -f docker-compose.dev.yml up -d
#
# Services: db (PostgreSQL 16), mongo (MongoDB 7), data-api (Express)
# Frontend runs locally via `pnpm dev` (Vite) for instant HMR.
# ============================================

services:
  # ── PostgreSQL 16 ────────────────────────────────
  db:
    container_name: transcendence-db
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-transcendence}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-transcendence}
      POSTGRES_DB: ${POSTGRES_DB:-transcendence}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-transcendence}"]
      interval: 3s
      timeout: 2s
      retries: 10

  # ── MongoDB 7 ────────────────────────────────────
  mongo:
    container_name: transcendence-mongo
    image: mongo:7-jammy
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 3s
      timeout: 2s
      retries: 10

  # ── data-api (Express REST) ──────────────────────
  data-api:
    container_name: transcendence-api
    build:
      context: ./apps/data-api
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    ports:
      - "${DATA_API_PORT:-3001}:3001"
    environment:
      NODE_ENV: development
      DATA_API_PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-transcendence}:${POSTGRES_PASSWORD:-transcendence}@db:5432/${POSTGRES_DB:-transcendence}
      MONGO_URL: mongodb://mongo:27017/${POSTGRES_DB:-transcendence}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-5173}
      MODEL_SQL_DIR: /app/Model/sql
    volumes:
      - ./apps/data-api/src:/app/src:ro
      - ./Model:/app/Model:ro
    depends_on:
      db:
        condition: service_healthy
      mongo:
        condition: service_healthy

volumes:
  pg_data:
  mongo_data:
