name: 🐛 Bug Report
description: Report a bug or unexpected behavior
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the form below so we can investigate.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: What happened? What did you expect to happen?
      placeholder: "When I click X, Y happens instead of Z..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should happen instead?
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Affected Area
      options:
        - Frontend (React / Vite)
        - Data API (Express)
        - Database — PostgreSQL
        - Database — MongoDB
        - Docker / Infrastructure
        - Documentation (Docusaurus)
        - CI/CD
        - Other
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - 🔴 Critical (app crashes / data loss)
        - 🟠 High (feature broken, no workaround)
        - 🟡 Medium (feature broken, workaround exists)
        - 🟢 Low (cosmetic / minor inconvenience)
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Any relevant info about your setup
      placeholder: |
        OS: Ubuntu 24.04
        Browser: Chrome 120
        Docker version: 27.x
        Node version: 22.x (if running locally)

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: Paste relevant error logs or screenshots

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues to make sure this isn't a duplicate
          required: true
        - label: I can reproduce this consistently
