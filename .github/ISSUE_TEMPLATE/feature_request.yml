name: ✨ Feature Request
description: Suggest a new feature or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea? Let's discuss it! Fill out the form below.

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: One or two sentences describing the feature
      placeholder: "As a [user type], I want [feature] so that [benefit]..."
    validations:
      required: true

  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: How would you implement this? (high level is fine)

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you've thought about?

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Frontend (React)
        - Backend (NestJS)
        - Database
        - DevOps / Infrastructure
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Suggested Priority
      options:
        - 🔴 Must Have (core requirement)
        - 🟠 Should Have (important but not blocking)
        - 🟡 Could Have (nice to have)
        - 🟢 Won't Have (future / out of scope)
    validations:
      required: true

  - type: textarea
    id: mockups
    attributes:
      label: Mockups / References
      description: Any designs, screenshots, or links that illustrate the idea?

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I've searched existing issues and this isn't a duplicate
          required: true
        - label: I've discussed this with the team (standup / Discord)
