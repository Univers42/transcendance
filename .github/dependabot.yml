version: 2
updates:
  # Root workspace
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Madrid"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 5

  # Docusaurus documentation site
  - package-ecosystem: "npm"
    directory: "/static_docs/docusaurus"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:45"
      timezone: "Europe/Madrid"
    labels:
      - "dependencies"
      - "docs"
    commit-message:
      prefix: "chore(docs-deps)"
    open-pull-requests-limit: 3

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:15"
      timezone: "Europe/Madrid"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(actions)"
    open-pull-requests-limit: 3
