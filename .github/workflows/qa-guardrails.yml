name: QA Guardrails

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  frontend-security:
    name: Frontend Security Guard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run frontend security guard
        run: bash qa/implementation/scripts/check-frontend-security.sh
