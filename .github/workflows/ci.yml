# ============================================
# Transcendence — CI Pipeline
# ============================================
# Runs on every push to develop/main and on every PR.
# Steps: compose validation → docs build
#
# Architecture (post-extraction):
#   prismatica/     — separate repo with its own CI (ghcr.io images)
#   static_docs/    — Docusaurus 3.9 documentation (npm)
#   docker-compose  — orchestration pulling ghcr.io/univers42/* images
# ============================================

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  # ── Compose Config Validation ───────────────────────
  compose:
    name: 🐳 Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate dev compose config
        run: docker compose -f docker-compose.dev.yml config --quiet

      - name: Validate prod compose config
        run: docker compose -f docker-compose.yml config --quiet

  # ── Docs Build ──────────────────────────────────────
  docs:
    name: 📚 Docs Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install Docusaurus dependencies
        run: cd static_docs/docusaurus && npm ci

      - name: Sync documentation
        run: cd static_docs/docusaurus && bash sync-docs.sh

      - name: Build docs site
        run: cd static_docs/docusaurus && npx docusaurus build --out-dir ../../docs
